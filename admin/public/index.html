      // --- Utils ---
      function esc(str) {
        if (!str) return "";
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
      }

      // --- Publish ---
      async function publish() {
        confirmDialog(
          "Publicar todas as alteracoes?",
          "Isso vai atualizar o site online. O deploy leva alguns minutos.",
          () => doPublish(),
          {
            confirmText: "Publicar",
            confirmClass: "btn-green",
            iconColor: "bg-emerald-900/50 text-emerald-400",
          },
        );
      }

      async function doPublish() {
        const btn = document.getElementById("btn-publish");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Publicando...';

        // Show progress modal
        const steps = [
          { label: "Compilando site...", key: "build" },
          { label: "Salvando alteracoes...", key: "save" },
          { label: "Enviando para GitHub...", key: "push" },
          { label: "Disparando deploy no Render...", key: "deploy" },
        ];

        openModal(
          "Publicando...",
          `
    <div class="space-y-1" id="publish-steps">
      ${steps
        .map(
          (s, i) => `
        <div class="publish-step" id="publish-step-${i}">
          <div class="step-icon bg-gray-800 text-gray-500">
            <span class="spinner text-xs"></span>
          </div>
          <span class="text-gray-400">${s.label}</span>
        </div>
      `,
        )
        .join("")}
    </div>
    <div id="publish-footer" class="hidden pt-4 mt-4 border-t border-gray-800/60">
      <button onclick="closeModal()" class="btn btn-gold w-full justify-center">Fechar</button>
    </div>
  `,
        );

        try {
          const res = await apiFetch(`${API}/api/publish`, { method: "POST" });
          const data = await res.json();

          if (data.success) {
            // Animate steps — detect warnings (Aviso) per step
            const serverSteps = data.steps || [];
            steps.forEach((s, i) => {
              setTimeout(() => {
                const stepEl = document.getElementById("publish-step-" + i);
                if (!stepEl) return;
                // Check if the corresponding server step has a warning
                const serverMsg = serverSteps.find((m) => m.toLowerCase().includes(s.key)) || "";
                const isWarning = serverMsg.startsWith("Aviso");
                if (isWarning) {
                  stepEl.querySelector(".step-icon").className =
                    "step-icon bg-yellow-900/50 text-yellow-400";
                  stepEl.querySelector(".step-icon").innerHTML =
                    '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>';
                  stepEl.querySelector("span:last-child").className = "text-yellow-400";
                  stepEl.querySelector("span:last-child").textContent = serverMsg;
                } else {
                  stepEl.querySelector(".step-icon").className =
                    "step-icon bg-emerald-900/50 text-emerald-400";
                  stepEl.querySelector(".step-icon").innerHTML =
                    '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
                  stepEl.querySelector("span:last-child").className = "text-gray-200";
                  stepEl.querySelector("span:last-child").textContent = s.label.replace("...", "");
                }
              }, i * 400);
            });

            const hasWarning = serverSteps.some((m) => m.startsWith("Aviso"));
            setTimeout(
              () => {
                document.getElementById("modal-title").textContent = hasWarning
                  ? "Publicado com avisos"
                  : "Publicacao concluida!";
                const footer = document.getElementById("publish-footer");
                if (footer) footer.classList.remove("hidden");
              },
              steps.length * 400 + 200,
            );

            toast(
              hasWarning
                ? "Publicado, mas com avisos. Verifique os detalhes."
                : "Site publicado com sucesso!",
              hasWarning ? "error" : "success",
            );
          } else {
            // Show error state
            const failIndex = data.steps ? data.steps.findIndex((s) => s.startsWith("Erro")) : 0;
            steps.forEach((s, i) => {
              const stepEl = document.getElementById("publish-step-" + i);
              if (!stepEl) return;
              if (i < failIndex || failIndex === -1) {
                stepEl.querySelector(".step-icon").className =
                  "step-icon bg-emerald-900/50 text-emerald-400";
                stepEl.querySelector(".step-icon").innerHTML =
                  '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
              } else if (i === failIndex || (failIndex === -1 && i === 0)) {
                stepEl.querySelector(".step-icon").className =
                  "step-icon bg-red-900/50 text-red-400";
                stepEl.querySelector(".step-icon").innerHTML =
                  '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
                stepEl.querySelector("span:last-child").className = "text-red-400";
              } else {
                stepEl.querySelector(".step-icon").className =
                  "step-icon bg-gray-800 text-gray-600";
                stepEl.querySelector(".step-icon").innerHTML =
                  '<span class="text-xs">&mdash;</span>';
                stepEl.querySelector("span:last-child").className = "text-gray-600";
              }
            });

            document.getElementById("modal-title").textContent = "Erro na publicacao";
            const footer = document.getElementById("publish-footer");
            if (footer) footer.classList.remove("hidden");

            toast("Erro ao publicar.", "error");
          }
        } catch (err) {
          // Connection error — mark all as failed
          document.getElementById("modal-title").textContent = "Erro de conexao";
          const stepEl = document.getElementById("publish-step-0");
          if (stepEl) {
            stepEl.querySelector(".step-icon").className = "step-icon bg-red-900/50 text-red-400";
            stepEl.querySelector(".step-icon").innerHTML =
              '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
            stepEl.querySelector("span:last-child").className = "text-red-400";
            stepEl.querySelector("span:last-child").textContent = "Erro de conexao com o servidor";
          }
          const footer = document.getElementById("publish-footer");
          if (footer) footer.classList.remove("hidden");

          toast("Erro de conexao ao publicar.", "error");
        }

        btn.disabled = false;
        btn.innerHTML =
          '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg> Publicar';
      }

      // --- Escape key closes modals ---
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const modal = document.getElementById("modal");
          if (modal && !modal.classList.contains("hidden")) {
            closeModal();
          }
        }
      });

      // --- Drag-and-drop for upload zones ---
      document.addEventListener("dragover", (e) => {
        const zone = e.target.closest(".upload-zone");
        if (zone) {
          e.preventDefault();
          zone.classList.add("border-gold/40", "bg-gold/5");
        }
      });
      document.addEventListener("dragleave", (e) => {
        const zone = e.target.closest(".upload-zone");
        if (zone) {
          zone.classList.remove("border-gold/40", "bg-gold/5");
        }
      });
      document.addEventListener("drop", (e) => {
        const zone = e.target.closest(".upload-zone");
        if (zone) {
          e.preventDefault();
          zone.classList.remove("border-gold/40", "bg-gold/5");
          const input = zone.querySelector('input[type="file"]');
          if (input && e.dataTransfer.files.length > 0) {
            input.files = e.dataTransfer.files;
            input.dispatchEvent(new Event("change"));
          }
        }
      });

      // --- Theme toggle ---
      const SUN_SVG =
        '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>';
      const MOON_SVG =
        '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>';

      function toggleAdminTheme() {
        document.documentElement.classList.toggle("dark");
        const isDark = document.documentElement.classList.contains("dark");
        localStorage.setItem("admin-theme", isDark ? "dark" : "light");
        updateAdminThemeIcon();
      }

      function updateAdminThemeIcon() {
        const isDark = document.documentElement.classList.contains("dark");
        const el = document.getElementById("admin-theme-icon");
        if (el) el.innerHTML = isDark ? SUN_SVG : MOON_SVG;
      }

      // Set icon on load
      document.addEventListener("DOMContentLoaded", updateAdminThemeIcon);

      // --- Init with error handling ---
      async function init() {
        try {
          await loadCollections();
        } catch (err) {
          document.getElementById("collections-list").innerHTML =
            '<div class="card text-center py-8"><p class="text-red-400 mb-3">Erro ao carregar colecoes</p><button onclick="loadCollections()" class="btn btn-outline text-xs">Tentar novamente</button></div>';
        }
        try {
          await loadTestimonials();
        } catch (err) {
          document.getElementById("testimonials-list").innerHTML =
            '<div class="card text-center py-8"><p class="text-red-400 mb-3">Erro ao carregar depoimentos</p><button onclick="loadTestimonials()" class="btn btn-outline text-xs">Tentar novamente</button></div>';
        }
        try {
          await loadSettings();
        } catch (err) {
          toast("Erro ao carregar configuracoes", "error");
        }
      }
      // ================================================================
      // Git Persist Banner
      // ================================================================
      let persistState = "clean";
      let persistPollTimer = null;

      async function checkPersistStatus() {
        try {
          const res = await fetch(`${API}/api/persist-status`);
          if (!res.ok) return;
          const { state, error } = await res.json();
          updatePersistBanner(state, error);
        } catch { /* ignore network errors */ }
      }

      function updatePersistBanner(state, error) {
        persistState = state;
        const banner = document.getElementById("persist-banner");
        const icon = document.getElementById("persist-icon");
        const text = document.getElementById("persist-text");
        const retry = document.getElementById("persist-retry");
        const tabBar = document.getElementById("tab-bar");

        // Reset classes
        banner.className = "border-b px-4 py-2 text-xs font-medium flex items-center justify-between sticky top-[65px] z-25 transition-all duration-300";

        if (state === "clean") {
          banner.classList.add("hidden");
          if (tabBar) tabBar.style.top = "65px";
          schedulePersistPoll(15000);
          return;
        }

        banner.classList.remove("hidden");
        if (tabBar) tabBar.style.top = "97px";

        const spinnerSvg = '<svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity="0.3"></circle><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path></svg>';
        const errorSvg = '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4m0 4h.01" stroke-linecap="round"></path></svg>';

        if (state === "dirty") {
          banner.classList.add("bg-yellow-900/30", "border-yellow-700/40", "text-yellow-300");
          icon.innerHTML = spinnerSvg;
          text.textContent = "Salvando alteracoes...";
          retry.classList.add("hidden");
          schedulePersistPoll(3000);
        } else if (state === "pushing") {
          banner.classList.add("bg-blue-900/30", "border-blue-700/40", "text-blue-300");
          icon.innerHTML = spinnerSvg;
          text.textContent = "Enviando para o GitHub...";
          retry.classList.add("hidden");
          schedulePersistPoll(3000);
        } else if (state === "error") {
          banner.classList.add("bg-red-900/30", "border-red-700/40", "text-red-300");
          icon.innerHTML = errorSvg;
          text.textContent = "Erro ao salvar no GitHub. Alteracoes podem ser perdidas.";
          retry.classList.remove("hidden");
          schedulePersistPoll(3000);
        }
      }

      async function retryPersist() {
        const retry = document.getElementById("persist-retry");
        if (retry) retry.disabled = true;
        try {
          await fetch(`${API}/api/persist-retry`, { method: "POST" });
          await checkPersistStatus();
        } finally {
          if (retry) retry.disabled = false;
        }
      }

      function schedulePersistPoll(interval) {
        if (persistPollTimer) clearInterval(persistPollTimer);
        persistPollTimer = setInterval(() => {
          if (!document.hidden) checkPersistStatus();
        }, interval);
      }

      // Pause polling when page is hidden, resume when visible
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) checkPersistStatus();
      });

      // Initial check + start polling
      checkPersistStatus();
      schedulePersistPoll(15000);

      init();
    </script>
  </body>
</html>
