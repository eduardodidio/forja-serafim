<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Forja Serafim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
          colors: {
            gold: { DEFAULT: '#d4a853', light: '#e8c97a', dark: '#b8903d' },
            surface: '#1a1a2e',
            deeper: '#12121f',
            panel: '#161625',
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    /* Tab underline animation */
    .tab-btn { position: relative; }
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: #d4a853;
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }
    .tab-btn.tab-active::after { width: 100%; }
    .tab-btn.tab-active { color: #d4a853; }

    /* Buttons */
    .btn {
      @apply px-4 py-2 rounded-xl text-sm font-medium transition-all duration-200 inline-flex items-center gap-2;
    }
    .btn:active { transform: scale(0.97); }
    .btn-gold {
      @apply bg-gradient-to-r from-gold-dark to-gold text-black hover:shadow-lg;
      box-shadow: 0 0 0 0 rgba(212,168,83,0);
    }
    .btn-gold:hover { box-shadow: 0 4px 20px rgba(212,168,83,0.3); }
    .btn-outline {
      @apply border border-gray-700 text-gray-300 hover:border-gold/60 hover:text-gold;
    }
    .btn-danger {
      @apply border border-red-900/60 text-red-400 hover:bg-red-900/30 hover:border-red-700;
    }
    .btn-green {
      @apply bg-gradient-to-r from-emerald-700 to-emerald-600 text-white hover:shadow-lg;
      box-shadow: 0 0 0 0 rgba(16,185,129,0);
    }
    .btn-green:hover { box-shadow: 0 4px 20px rgba(16,185,129,0.25); }
    .btn-green:disabled {
      @apply opacity-50 cursor-not-allowed;
      box-shadow: none !important;
      filter: grayscale(0.5);
    }

    /* Inputs */
    .input {
      @apply w-full rounded-xl border border-gray-700/80 bg-deeper px-4 py-2.5 text-sm text-gray-200 outline-none transition-all duration-200;
    }
    .input:focus {
      border-color: rgba(212,168,83,0.6);
      box-shadow: 0 0 0 3px rgba(212,168,83,0.1);
    }
    .input::placeholder { @apply text-gray-600; }

    /* Cards */
    .card {
      @apply rounded-2xl border border-gray-800/80 bg-surface p-5 transition-all duration-300;
    }
    .card:hover {
      border-color: rgba(212,168,83,0.2);
      box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 0 1px rgba(212,168,83,0.05);
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .toast-item {
      @apply rounded-xl px-5 py-3.5 text-sm font-medium shadow-2xl flex items-center gap-3;
      animation: toast-in 0.35s ease-out;
      position: relative;
      overflow: hidden;
    }
    .toast-item.toast-out { animation: toast-out 0.3s ease-in forwards; }
    .toast-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      border-radius: 0 0 0 0.75rem;
      animation: toast-progress 3s linear forwards;
    }
    @keyframes toast-in {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes toast-out {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }
    @keyframes toast-progress {
      from { width: 100%; }
      to { width: 0%; }
    }

    /* Modal */
    .modal-backdrop {
      @apply fixed inset-0 z-40;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
    }
    .modal-backdrop.show { animation: fade-in 0.2s ease-out; }
    .modal-content.show { animation: modal-in 0.25s ease-out; }
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes modal-in {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Badge */
    .badge {
      @apply inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-medium;
    }
    .badge-green { @apply bg-emerald-900/40 text-emerald-400 border border-emerald-800/50; }
    .badge-gray { @apply bg-gray-800/50 text-gray-500 border border-gray-700/50 border-dashed; }
    .badge-gold { @apply bg-gold/10 text-gold border border-gold/20; }

    /* Upload zone */
    .upload-zone {
      @apply rounded-xl border-2 border-dashed border-gray-700 p-4 text-center cursor-pointer transition-all duration-200;
    }
    .upload-zone:hover {
      @apply border-gold/40 bg-gold/5;
    }

    /* Fade in animation for lists */
    .fade-in { animation: fade-in 0.4s ease-out; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 1em;
      height: 1em;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Publish step */
    .publish-step {
      @apply flex items-center gap-3 py-2.5 text-sm;
      transition: all 0.3s ease;
    }
    .publish-step .step-icon {
      @apply flex items-center justify-center w-7 h-7 rounded-full text-xs flex-shrink-0;
      transition: all 0.3s ease;
    }

    /* Skeleton */
    .skeleton {
      @apply rounded-xl bg-gray-800/50;
      animation: skeleton-pulse 1.5s ease-in-out infinite;
    }
    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    /* Section divider */
    .section-divider {
      @apply flex items-center gap-3 py-2;
    }
    .section-divider::after {
      content: '';
      @apply flex-1 h-px bg-gray-800;
    }

    /* Confirm modal */
    .confirm-icon {
      @apply flex items-center justify-center w-12 h-12 rounded-full mx-auto mb-3;
    }
  </style>
</head>
<body class="min-h-screen bg-deeper text-gray-200">

  <!-- Header -->
  <header class="border-b border-gray-800/80 bg-surface/95 backdrop-blur-sm sticky top-0 z-30">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
      <div class="flex items-center gap-3">
        <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-gold/10 text-gold text-lg">
          &#9733;
        </div>
        <div>
          <h1 class="text-lg font-bold text-gold tracking-tight">Forja Serafim</h1>
          <div class="flex items-center gap-2">
            <span class="badge badge-gold text-[10px] py-0 px-1.5">ADMIN</span>
            <p class="text-xs text-gray-500">Painel Administrativo</p>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <a href="http://localhost:8080" target="_blank"
           class="btn btn-outline text-xs py-1.5 px-3">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          Ver site
        </a>
        <button onclick="publish()" id="btn-publish" class="btn btn-green text-xs py-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
          Publicar
        </button>
      </div>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="border-b border-gray-800/60 bg-surface/60 backdrop-blur-sm sticky top-[65px] z-20">
    <div class="mx-auto flex max-w-6xl gap-0 px-5">
      <button onclick="showTab('collections')" id="tab-collections"
              class="tab-btn px-5 py-3.5 text-sm text-gray-400 hover:text-gray-200 transition-colors flex items-center gap-2 tab-active">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        Colecoes <span id="count-collections" class="badge badge-gold text-[10px] py-0 px-1.5 ml-1 hidden">0</span>
      </button>
      <button onclick="showTab('testimonials')" id="tab-testimonials"
              class="tab-btn px-5 py-3.5 text-sm text-gray-400 hover:text-gray-200 transition-colors flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        Depoimentos <span id="count-testimonials" class="badge badge-gold text-[10px] py-0 px-1.5 ml-1 hidden">0</span>
      </button>
      <button onclick="showTab('settings')" id="tab-settings"
              class="tab-btn px-5 py-3.5 text-sm text-gray-400 hover:text-gray-200 transition-colors flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
        Configuracoes
      </button>
    </div>
  </nav>

  <!-- Content -->
  <main class="mx-auto max-w-6xl px-5 py-8">

    <!-- Collections Tab -->
    <div id="panel-collections" class="fade-in">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold">Colecoes</h2>
        <button onclick="openAddCollection()" class="btn btn-gold">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Nova colecao
        </button>
      </div>
      <div id="collections-list" class="grid gap-5">
        <!-- Skeleton loading -->
        <div class="skeleton h-48 w-full"></div>
        <div class="skeleton h-48 w-full"></div>
      </div>
    </div>

    <!-- Testimonials Tab -->
    <div id="panel-testimonials" class="hidden fade-in">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-semibold">Depoimentos</h2>
        <button onclick="openAddTestimonial()" class="btn btn-gold">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Novo depoimento
        </button>
      </div>
      <div id="testimonials-list" class="grid gap-4">
        <div class="skeleton h-28 w-full"></div>
        <div class="skeleton h-28 w-full"></div>
      </div>
    </div>

    <!-- Settings Tab -->
    <div id="panel-settings" class="hidden fade-in">
      <h2 class="text-xl font-semibold mb-6">Configuracoes</h2>
      <div class="card max-w-xl">
        <div class="section-divider">
          <span class="text-sm font-semibold text-gold flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2 22l4.832-1.438A9.955 9.955 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18a7.96 7.96 0 01-4.11-1.14l-.29-.174-3.01.79.8-2.93-.19-.3A7.96 7.96 0 014 12c0-4.411 3.589-8 8-8s8 3.589 8 8-3.589 8-8 8z"/></svg>
            Contato
          </span>
        </div>
        <div class="space-y-4 mt-4">
          <div>
            <label class="text-xs font-medium text-gray-400 mb-1.5 block">Link do WhatsApp</label>
            <div class="relative">
              <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
              </span>
              <input id="settings-whatsapp" class="input pl-10" placeholder="https://wa.me/5551999999999" oninput="onSettingsChange()" />
            </div>
            <p class="text-xs text-gray-500 mt-2 flex items-center gap-1.5">
              <svg class="w-3 h-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              Formato: <code class="bg-gray-800 px-1.5 py-0.5 rounded text-gray-400">https://wa.me/55XXXXXXXXXXX</code> (pais + DDD + numero)
            </p>
          </div>
          <div class="flex justify-end pt-2">
            <button onclick="saveSettings()" id="btn-save-settings" class="btn btn-gold" disabled>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              Salvar
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal backdrop -->
  <div id="modal-backdrop" class="modal-backdrop hidden" onclick="closeModal()"></div>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden overflow-y-auto">
    <div class="w-full max-w-lg rounded-2xl border border-gray-800/80 bg-surface p-6 shadow-2xl my-8 relative modal-content"
         onclick="event.stopPropagation()">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-300 transition-colors p-1 rounded-lg hover:bg-gray-800/50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <h3 id="modal-title" class="text-lg font-semibold mb-5 pr-8"></h3>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

<script>
const API = '';

// --- State ---
let collections = [];
let testimonials = [];
let settings = {};
let settingsOriginal = '';

// --- Tabs ---
const TABS = ['collections', 'testimonials', 'settings'];
function showTab(tab) {
  TABS.forEach(t => {
    const panel = document.getElementById('panel-' + t);
    const btn = document.getElementById('tab-' + t);
    panel.classList.toggle('hidden', t !== tab);
    btn.classList.toggle('tab-active', t === tab);
  });
}

// --- Toast ---
function toast(msg, type = 'success') {
  const container = document.getElementById('toast-container');
  const item = document.createElement('div');
  const icon = type === 'success'
    ? '<svg class="w-5 h-5 text-emerald-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
    : '<svg class="w-5 h-5 text-red-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>';
  const bgClass = type === 'success'
    ? 'bg-emerald-950/90 text-emerald-200 border border-emerald-800/50'
    : 'bg-red-950/90 text-red-200 border border-red-800/50';
  const progressColor = type === 'success' ? 'bg-emerald-500' : 'bg-red-500';

  item.className = `toast-item ${bgClass}`;
  item.innerHTML = `${icon}<span>${esc(msg)}</span><div class="toast-progress ${progressColor}"></div>`;
  container.appendChild(item);

  setTimeout(() => {
    item.classList.add('toast-out');
    setTimeout(() => item.remove(), 300);
  }, 3000);
}

// --- Modal ---
function openModal(title, html) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = html;
  const modal = document.getElementById('modal');
  const backdrop = document.getElementById('modal-backdrop');
  modal.classList.remove('hidden');
  backdrop.classList.remove('hidden');
  backdrop.classList.add('show');
  modal.querySelector('.modal-content').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('modal-backdrop').classList.add('hidden');
  document.getElementById('modal-backdrop').classList.remove('show');
}

// --- Confirm dialog (replaces native confirm) ---
function confirmDialog(message, detail, onConfirm, options = {}) {
  const { confirmText = 'Confirmar', confirmClass = 'btn-danger', iconColor = 'bg-red-900/50 text-red-400' } = options;
  openModal('', `
    <div class="text-center">
      <div class="confirm-icon ${iconColor}">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
      </div>
      <p class="text-base font-semibold text-gray-200 mb-1">${esc(message)}</p>
      ${detail ? `<p class="text-sm text-gray-400 mb-5">${esc(detail)}</p>` : '<div class="mb-5"></div>'}
      <div class="flex justify-center gap-3">
        <button onclick="closeModal()" class="btn btn-outline">Cancelar</button>
        <button onclick="closeModal(); (${onConfirm.toString()})()" class="btn ${confirmClass}">
          ${esc(confirmText)}
        </button>
      </div>
    </div>
  `);
}

// --- Update tab counters ---
function updateCounters() {
  const cc = document.getElementById('count-collections');
  const ct = document.getElementById('count-testimonials');
  if (collections.length > 0) {
    cc.textContent = collections.length;
    cc.classList.remove('hidden');
  } else {
    cc.classList.add('hidden');
  }
  if (testimonials.length > 0) {
    ct.textContent = testimonials.length;
    ct.classList.remove('hidden');
  } else {
    ct.classList.add('hidden');
  }
}

// --- Settings ---
async function loadSettings() {
  const res = await fetch(`${API}/api/settings`);
  settings = await res.json();
  const input = document.getElementById('settings-whatsapp');
  input.value = settings.whatsappUrl || '';
  settingsOriginal = input.value;
  document.getElementById('btn-save-settings').disabled = true;
}

function onSettingsChange() {
  const current = document.getElementById('settings-whatsapp').value.trim();
  document.getElementById('btn-save-settings').disabled = (current === settingsOriginal);
}

async function saveSettings() {
  const whatsappUrl = document.getElementById('settings-whatsapp').value.trim();
  const btn = document.getElementById('btn-save-settings');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Salvando...';

  const res = await fetch(`${API}/api/settings`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ whatsappUrl }),
  });

  btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Salvar';

  if (!res.ok) { toast('Erro ao salvar.', 'error'); btn.disabled = false; return; }

  btn.disabled = true;
  toast('Configuracoes salvas!');
}

function previewCover(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('f-cover-img').src = e.target.result;
    document.getElementById('f-cover-preview').classList.remove('hidden');
    document.getElementById('f-cover-placeholder').classList.add('hidden');
  };
  reader.readAsDataURL(file);
}

async function addCollection() {
  const name = document.getElementById('f-name').value.trim();
  const description = document.getElementById('f-desc').value.trim();
  const cardCount = parseInt(document.getElementById('f-cards').value);
  const deckcheckUrl = document.getElementById('f-deckcheck').value.trim();
  const moxfieldUrl = document.getElementById('f-moxfield').value.trim();
  const coverFile = document.getElementById('f-cover').files[0];

  if (!name || !description || !cardCount) { toast('Preencha nome, descricao e quantidade.', 'error'); return; }
  if (!coverFile) { toast('A imagem de capa e obrigatoria!', 'error'); return; }

  const res = await fetch(`${API}/api/collections`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, description, cardCount, deckcheckUrl, moxfieldUrl }),
  });

  if (!res.ok) { const e = await res.json(); toast(e.error, 'error'); return; }

  const newCol = await res.json();

  // Upload cover
  const fd = new FormData();
  fd.append('file', coverFile);
  await fetch(`${API}/api/collections/${newCol.slug}/cover`, { method: 'POST', body: fd });

  closeModal();
  toast(`Colecao "${name}" adicionada com capa!`);
  await loadCollections();
}

async function saveCollection(slug) {

  const description = document.getElementById('f-desc').value.trim();
  const cardCount = parseInt(document.getElementById('f-cards').value);
  const deckcheckUrl = document.getElementById('f-deckcheck').value.trim();
  const moxfieldUrl = document.getElementById('f-moxfield').value.trim();

  const res = await fetch(`${API}/api/collections/${slug}`, {

async function toggleCollectionVisibility(slug) {
  const c = collections.find(x => x.slug === slug);
  if (!c) return;
  const newHidden = !c.hidden;
  const action = newHidden ? 'Ocultar' : 'Exibir';
  const msg = newHidden
    ? 'A colecao sera removida do site publico, mas pode ser reexibida a qualquer momento.'
    : 'A colecao voltara a aparecer no site publico.';
  confirmDialog(
    `${action} "${c.name}"?`,
    msg,
    async () => {
      await fetch(`${API}/api/collections/${slug}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ hidden: newHidden }),
      });
      toast(`Colecao ${newHidden ? 'ocultada' : 'exibida'}!`);
      await loadCollections();
    },
    { confirmText: action, confirmClass: newHidden ? 'btn-outline' : 'btn-green' }
  );
}

async function uploadCover(slug, input) {
  const file = input.files[0];
  if (!file) return;

  const label = document.getElementById('upload-cover-' + slug);
  const origHTML = label.innerHTML;
  label.innerHTML = '<span class="spinner"></span> Enviando...';

  const fd = new FormData();
  fd.append('file', file);

  const res = await fetch(`${API}/api/collections/${slug}/cover`, { method: 'POST', body: fd });

  label.innerHTML = origHTML;

  if (!res.ok) { toast('Erro ao enviar capa.', 'error'); return; }

  toast('Capa atualizada!');
  input.value = '';
  await loadCollections();
}

async function uploadImages(slug, input) {
  const files = input.files;
  if (!files.length) return;

  const label = document.getElementById('upload-images-' + slug);
  const origHTML = label.innerHTML;
  label.innerHTML = `<span class="spinner"></span> Processando ${files.length} imagens...`;

  const fd = new FormData();
  for (const f of files) fd.append('files', f);

  const res = await fetch(`${API}/api/collections/${slug}/images`, { method: 'POST', body: fd });

  label.innerHTML = origHTML;

  if (!res.ok) { toast('Erro ao processar imagens.', 'error'); return; }

  const { processed } = await res.json();

  // Add processed images as samples
  const c = collections.find(x => x.slug === slug);
  if (c) {
    const allSamples = [...new Set([...c.sampleImages, ...processed])];
    await fetch(`${API}/api/collections/${slug}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sampleImages: allSamples }),
    });
  }

  toast(`${processed.length} imagens processadas!`);
  input.value = '';
  await loadCollections();
}

async function uploadManual(slug, input) {

}

async function loadTestimonials() {
  const res = await fetch(`${API}/api/testimonials`);
  testimonials = await res.json();
  renderTestimonials();
  updateCounters();
}

function renderTestimonials() {
  const el = document.getElementById('testimonials-list');
  if (testimonials.length === 0) {
    el.innerHTML = `
      <div class="card flex flex-col items-center justify-center py-16 text-center">
        <div class="w-16 h-16 rounded-2xl bg-gold/10 flex items-center justify-center mb-4">
          <svg class="w-8 h-8 text-gold/60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        </div>
        <p class="text-gray-400 font-medium mb-1">Nenhum depoimento ainda</p>
        <p class="text-gray-600 text-sm mb-5">Adicione depoimentos dos seus clientes</p>
        <button onclick="openAddTestimonial()" class="btn btn-gold">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Adicionar primeiro depoimento
        </button>
      </div>`;
    return;
  }
  el.innerHTML = testimonials.map((t, i) => `
    <div class="card fade-in">
      <div class="flex items-start gap-4">
        <!-- Decorative quote -->
        <div class="flex-shrink-0 text-gold/20 text-4xl font-serif leading-none mt-1">&ldquo;</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="flex items-center justify-center w-11 h-11 rounded-full bg-gradient-to-br from-gold/20 to-gold/5 font-bold text-sm text-gold border border-gold/20">
                ${esc(t.name.charAt(0).toUpperCase())}
              </div>
              <div>
                <p class="font-semibold text-gray-200">${esc(t.name)}</p>
                ${t.deck
                  ? `<span class="badge badge-gold text-[10px] mt-0.5">${esc(t.deck)}</span>`
                  : '<span class="text-xs text-gray-600">Sem deck associado</span>'}
              </div>
            </div>
            <div class="flex gap-2 flex-shrink-0">
              <button onclick="openEditTestimonial(${i})" class="btn btn-outline text-xs py-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                Editar
              </button>
              <button onclick="confirmDeleteTestimonial(${i})" class="btn btn-danger text-xs py-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                Remover
              </button>
            </div>
          </div>
          <p class="text-sm text-gray-300 mt-3 italic leading-relaxed">"${esc(t.text)}"</p>
        </div>
      </div>
    </div>
  `).join('');
}

function openAddTestimonial() {
  const deckOptions = collections.map(c =>
    `<option value="${esc(c.name)}">${esc(c.name)}</option>`
  ).join('');

  openModal('Novo depoimento', `
    <div class="space-y-4">
      <div>
        <label class="text-xs font-medium text-gray-400 mb-1.5 block">Nome do cliente <span class="text-gold">*</span></label>
        <input id="f-tname" class="input" placeholder="Ex: Joao Silva" />
      </div>
      <div>
        <label class="text-xs font-medium text-gray-400 mb-1.5 block">Depoimento <span class="text-gold">*</span></label>
        <textarea id="f-ttext" class="input" rows="3" placeholder="O que o cliente disse..."></textarea>
      </div>
      <div>
        <label class="text-xs font-medium text-gray-400 mb-1.5 block">Deck associado</label>
        <select id="f-tdeck" class="input">
          <option value="">(nenhum)</option>
          ${deckOptions}
        </select>
      </div>
      <div class="flex justify-end gap-3 pt-3 border-t border-gray-800/60">
        <button onclick="closeModal()" class="btn btn-outline">Cancelar</button>
        <button onclick="addTestimonial()" class="btn btn-gold">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Adicionar
        </button>
      </div>
    </div>
  `);
}

async function addTestimonial() {
  const name = document.getElementById('f-tname').value.trim();
  const text = document.getElementById('f-ttext').value.trim();
  const deck = document.getElementById('f-tdeck').value;

  if (!name || !text) { toast('Nome e texto sao obrigatorios.', 'error'); return; }

  const res = await fetch(`${API}/api/testimonials`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, text, deck }),
  });

  if (!res.ok) { const e = await res.json(); toast(e.error, 'error'); return; }

  closeModal();
  toast(`Depoimento de "${name}" adicionado!`);
  await loadTestimonials();
}

function openEditTestimonial(idx) {
  const t = testimonials[idx];
  if (!t) return;

  const deckOptions = collections.map(c =>
    `<option value="${esc(c.name)}" ${c.name === t.deck ? 'selected' : ''}>${esc(c.name)}</option>`
  ).join('');

  openModal('Editar depoimento', `
    <div class="space-y-4">
      <div>
        <label class="text-xs font-medium text-gray-400 mb-1.5 block">Nome do cliente</label>
        <input id="f-tname" class="input" value="${esc(t.name)}" />
      </div>
      <div>
        <label class="text-xs font-medium text-gray-400 mb-1.5 block">Depoimento</label>
        <textarea id="f-ttext" class="input" rows="3">${esc(t.text)}</textarea>
      </div>
      <div>
        <label class="text-xs font-medium text-gray-400 mb-1.5 block">Deck associado</label>
        <select id="f-tdeck" class="input">
          <option value="">(nenhum)</option>
          ${deckOptions}
        </select>
      </div>
      <div class="flex justify-end gap-3 pt-3 border-t border-gray-800/60">
        <button onclick="closeModal()" class="btn btn-outline">Cancelar</button>
        <button onclick="saveTestimonial(${idx})" class="btn btn-gold">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          Salvar
        </button>
      </div>
    </div>
  `);
}

async function saveTestimonial(idx) {
  const name = document.getElementById('f-tname').value.trim();
  const text = document.getElementById('f-ttext').value.trim();
  const deck = document.getElementById('f-tdeck').value;

  const res = await fetch(`${API}/api/testimonials/${idx}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, text, deck }),
  });

  if (!res.ok) { const e = await res.json(); toast(e.error, 'error'); return; }

  closeModal();
  toast('Depoimento atualizado!');
  await loadTestimonials();
}

function confirmDeleteTestimonial(idx) {
  const t = testimonials[idx];
  confirmDialog(
    `Remover depoimento de "${t?.name}"?`,
    'Essa acao nao pode ser desfeita.',
    () => deleteTestimonial(idx),
    { confirmText: 'Remover', confirmClass: 'btn-danger' }
  );
}

async function deleteTestimonial(idx) {
  await fetch(`${API}/api/testimonials/${idx}`, { method: 'DELETE' });
  toast('Depoimento removido.');
  await loadTestimonials();
}

// --- Utils ---
function esc(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// --- Publish ---
async function publish() {
  confirmDialog(
    'Publicar todas as alteracoes?',
    'Isso vai atualizar o site online. O deploy leva alguns minutos.',
    () => doPublish(),
    {
      confirmText: 'Publicar',
      confirmClass: 'btn-green',
      iconColor: 'bg-emerald-900/50 text-emerald-400'
    }
  );
}

async function doPublish() {
  const btn = document.getElementById('btn-publish');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Publicando...';

  // Show progress modal
  const steps = [
    { label: 'Compilando site...', key: 'build' },
    { label: 'Salvando alteracoes...', key: 'save' },
    { label: 'Enviando para GitHub...', key: 'push' },
    { label: 'Disparando deploy no Render...', key: 'deploy' },
  ];

  openModal('Publicando...', `
    <div class="space-y-1" id="publish-steps">
      ${steps.map((s, i) => `
        <div class="publish-step" id="publish-step-${i}">
          <div class="step-icon bg-gray-800 text-gray-500">
            <span class="spinner text-xs"></span>
          </div>
          <span class="text-gray-400">${s.label}</span>
        </div>
      `).join('')}
    </div>
    <div id="publish-footer" class="hidden pt-4 mt-4 border-t border-gray-800/60">
      <button onclick="closeModal()" class="btn btn-gold w-full justify-center">Fechar</button>
    </div>
  `);

  try {
    const res = await fetch(`${API}/api/publish`, { method: 'POST' });
    const data = await res.json();

    if (data.success) {
      // Animate steps to success
      steps.forEach((s, i) => {
        setTimeout(() => {
          const stepEl = document.getElementById('publish-step-' + i);
          if (!stepEl) return;
          stepEl.querySelector('.step-icon').className = 'step-icon bg-emerald-900/50 text-emerald-400';
          stepEl.querySelector('.step-icon').innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
          stepEl.querySelector('span:last-child').className = 'text-gray-200';
          stepEl.querySelector('span:last-child').textContent = s.label.replace('...', '');
        }, i * 400);
      });

      setTimeout(() => {
        document.getElementById('modal-title').textContent = 'Publicacao concluida!';
        const footer = document.getElementById('publish-footer');
        if (footer) footer.classList.remove('hidden');
      }, steps.length * 400 + 200);

      toast('Site publicado com sucesso!');
    } else {
      // Show error state
      const failIndex = data.steps ? data.steps.findIndex(s => s.startsWith('Erro')) : 0;
      steps.forEach((s, i) => {
        const stepEl = document.getElementById('publish-step-' + i);
        if (!stepEl) return;
        if (i < failIndex || (failIndex === -1)) {
          stepEl.querySelector('.step-icon').className = 'step-icon bg-emerald-900/50 text-emerald-400';
          stepEl.querySelector('.step-icon').innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
        } else if (i === failIndex || (failIndex === -1 && i === 0)) {
          stepEl.querySelector('.step-icon').className = 'step-icon bg-red-900/50 text-red-400';
          stepEl.querySelector('.step-icon').innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
          stepEl.querySelector('span:last-child').className = 'text-red-400';
        } else {
          stepEl.querySelector('.step-icon').className = 'step-icon bg-gray-800 text-gray-600';
          stepEl.querySelector('.step-icon').innerHTML = '<span class="text-xs">&mdash;</span>';
          stepEl.querySelector('span:last-child').className = 'text-gray-600';
        }
      });

      document.getElementById('modal-title').textContent = 'Erro na publicacao';
      const footer = document.getElementById('publish-footer');
      if (footer) footer.classList.remove('hidden');

      toast('Erro ao publicar.', 'error');
    }
  } catch (err) {
    // Connection error — mark all as failed
    document.getElementById('modal-title').textContent = 'Erro de conexao';
    const stepEl = document.getElementById('publish-step-0');
    if (stepEl) {
      stepEl.querySelector('.step-icon').className = 'step-icon bg-red-900/50 text-red-400';
      stepEl.querySelector('.step-icon').innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
      stepEl.querySelector('span:last-child').className = 'text-red-400';
      stepEl.querySelector('span:last-child').textContent = 'Erro de conexao com o servidor';
    }
    const footer = document.getElementById('publish-footer');
    if (footer) footer.classList.remove('hidden');

    toast('Erro de conexao ao publicar.', 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg> Publicar';
}

// --- Escape key closes modals ---
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const modal = document.getElementById('modal');
    if (modal && !modal.classList.contains('hidden')) {
      closeModal();
    }
  }
});

// --- Double-click protection helper ---
function withGuard(btn, asyncFn) {
  return async function(...args) {
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      await asyncFn(...args);
    } finally {
      btn.disabled = false;
    }
  };
}

// --- Drag-and-drop for upload zones ---
document.addEventListener('dragover', (e) => {
  const zone = e.target.closest('.upload-zone');
  if (zone) {
    e.preventDefault();
    zone.classList.add('border-gold/40', 'bg-gold/5');
  }
});
document.addEventListener('dragleave', (e) => {
  const zone = e.target.closest('.upload-zone');
  if (zone) {
    zone.classList.remove('border-gold/40', 'bg-gold/5');
  }
});
document.addEventListener('drop', (e) => {
  const zone = e.target.closest('.upload-zone');
  if (zone) {
    e.preventDefault();
    zone.classList.remove('border-gold/40', 'bg-gold/5');
    const input = zone.querySelector('input[type="file"]');
    if (input && e.dataTransfer.files.length > 0) {
      input.files = e.dataTransfer.files;
      input.dispatchEvent(new Event('change'));
    }
  }
});

// --- Init with error handling ---
async function init() {
  try {
    await loadCollections();
  } catch (err) {
    document.getElementById('collections-list').innerHTML =
      '<div class="card text-center py-8"><p class="text-red-400 mb-3">Erro ao carregar colecoes</p><button onclick="loadCollections()" class="btn btn-outline text-xs">Tentar novamente</button></div>';
  }
  try {
    await loadTestimonials();
  } catch (err) {
    document.getElementById('testimonials-list').innerHTML =
      '<div class="card text-center py-8"><p class="text-red-400 mb-3">Erro ao carregar depoimentos</p><button onclick="loadTestimonials()" class="btn btn-outline text-xs">Tentar novamente</button></div>';
  }
  try {
    await loadSettings();
  } catch (err) {
    toast('Erro ao carregar configuracoes', 'error');
  }
}
init();
</script>
