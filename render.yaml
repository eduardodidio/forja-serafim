services:
  - type: web
    runtime: node
    name: forja-serafim
    buildCommand: curl -fsSL https://bun.sh/install | bash && export PATH="$HOME/.bun/bin:$PATH" && bun install && bun add sharp && bun run build
    startCommand: export PATH="$HOME/.bun/bin:$PATH" && bun admin/src/server.ts
    plan: free
    headers:
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
