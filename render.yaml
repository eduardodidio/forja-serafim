services:
  # --- Site estatico (landing page) ---
  - type: web
    runtime: static
    name: casa-do-serafim
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # --- Admin panel (web service) ---
  - type: web
    runtime: node
    name: serafim-admin
    buildCommand: curl -fsSL https://bun.sh/install | bash && export PATH="$HOME/.bun/bin:$PATH" && bun install && bun add sharp
    startCommand: export PATH="$HOME/.bun/bin:$PATH" && bun admin/src/server.ts
    plan: free
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RENDER_DEPLOY_HOOK
        sync: false
